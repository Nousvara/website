<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Nousvara</title>
  <desc id="d">Letter N with white stems and a dark diagonal on a teal-to-blue gradient tile, drawn from the Nousvara wordmark.</desc>
  <defs>
    <linearGradient id="tile-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C2A8"/>
      <stop offset="55%" stop-color="#03a9f5"/>
      <stop offset="100%" stop-color="#2c4ce9"/>
    </linearGradient>
  </defs>
  <!-- Colourful gradient tile. -->
  <rect width="512" height="512" rx="112" fill="url(#tile-grad)"/>
  <!-- Glyph space is 87 x 100 units, matching the wordmark letterform. Two-tone N: white stems with
       a dark-ink diagonal so the two-colour identity stays legible against the blue tile. -->
  <g transform="translate(142.9 126) scale(2.6)">
    <rect x="0" y="0" width="18" height="100" fill="#FFFFFF"/>
    <rect x="69" y="0" width="18" height="100" fill="#FFFFFF"/>
    <polygon points="18,0 37,0 87,100 69,100" fill="#0b1a2b"/>
  </g>
</svg>
